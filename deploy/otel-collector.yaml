# Optional OTLP gateway. Set OTEL_BACKEND_ENDPOINT to an actual OTLP/HTTP backend.
# Run with an OpenTelemetry Collector distribution that includes file_storage.
extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch: {}
exporters:
  otlphttp/backend:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    sending_queue:
      storage: file_storage
      queue_size: 2048
    retry_on_failure:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 10m
service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/backend]
